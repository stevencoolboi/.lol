<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
    }

    p {
      color: black;
      text-align: center;
    } 

    h1 {
      color: black;
      text-align: center;
    }

    img, iframe {
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* Dancing cat animation */
    .dancing-cat {
      animation: dance 1s infinite ease-in-out;
      transform-origin: center;
    }

    @keyframes dance {
      0%   { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-10px) rotate(-5deg); }
      50%  { transform: translateY(0) rotate(0deg); }
      75%  { transform: translateY(-10px) rotate(5deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* Typewriter style */
    #typewriter {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      min-height: 30px; /* avoid jump when empty */
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #333;
      animation: blink-caret 0.75s step-end infinite;
      max-width: 90vw;
      margin-left: auto;
      margin-right: auto;
      font-family: "Comic Sans MS", cursive, sans-serif;
    }

    @keyframes blink-caret {
      50% { border-color: transparent; }
    }
  </style>
  <title>helo mi friend</title>
</head>
<body>
  <h1>heyo site still under consturction</h1>

  
  <p>pls no buly me :'(((((</p>
  <img src="https://th.bing.com/th/id/OIP.2R1rv1-xCNPa4J8EC8iQZAAAAA?w=145&h=155&c=7&r=0&o=7&cb=12&dpr=1.3&pid=1.7&rm=3" alt="Description of the image">
  <p>noo why do this to me :/</p>

  <h1>anyways look at my cool cat</h1>
  <img class="dancing-cat" src="https://i.imgur.com/TLHh4XB.png" alt="cool ass cat">

  <!-- Background music with no controls -->
  <audio id="bg-music" autoplay loop>
    <source src="https://res.cloudinary.com/dsupt7uln/video/upload/v1760297570/ytmp3free.cc_ryd-youtubemp3free.org_efqjio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const music = document.getElementById('bg-music');
    music.volume = 0.10; // chill volume

    // Typewriter effect
    const text = "i eat poo lol";
    let i = 0;
    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 100);
      }
    }
    typeWriter();
  </script>
  
  <p> really cool site right hahahahahah </p>
</body>
</html>
